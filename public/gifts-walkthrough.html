<style>

const button = (label, attrs = '', style = '') => '<button class="btn '+style+'" '+attrs+'>'+label+'</button>';
const route = (page, label) => button(label, 'data-go="'+page+'"', 'link');
const photo = (index, alt = '') => '<img src="'+images[index]+'" alt="'+escape(alt)+'">';
const dateKey = date => [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-');
const parseDate = value => new Date(value+'T12:00:00');
const formatDate = value => parseDate(value).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
const today = () => dateKey(new Date());
function future(days) {
  const date = new Date();
  date.setDate(date.getDate()+days);
  return dateKey(date);
}
function nextDate(occasion) {
  if (!occasion.annual || occasion.date >= today()) return occasion.date;
  const [, month, day] = occasion.date.split('-').map(Number);
  const year = new Date().getFullYear();
  const inYear = y => dateKey(new Date(y, month-1, Math.min(day, new Date(y, month, 0).getDate())));
  return inYear(year) < today() ? inYear(year+1) : inYear(year);
}
function nextOccasion() {
  return state.people.flatMap(person => person.occasions.map(occasion => ({person, occasion, date: nextDate(occasion)})))
    .filter(event => event.date >= today()).sort((a,b) => a.date.localeCompare(b.date))[0];
}
function dateTile(date) {
  const value = parseDate(date);
  return '<div class="date-tile" aria-hidden="true"><span>'+value.toLocaleDateString('en-US',{month:'short'})+'</span><strong>'+value.getDate()+'</strong></div>';
}

function rankedIdeas(indices, person) {
  if (!person.learn || !person.viewed.length) return indices;
  const recentTags = products[person.viewed.at(-1)]?.[3].split(' ') ?? [];
  const score = index => products[index][3].split(' ').filter(tag=>recentTags.includes(tag)).length;
  return [...indices].sort((a,b)=>score(b)-score(a));
}
function giftSections(person) {
  const name = escape(person.name);
  const interests = person.interests.toLowerCase();
  const sections = [];
  if (/gardening|plants|garden/.test(interests)) {
    sections.push({key:'gardening', title:'Because '+name+' likes gardening', label:'Gardening', indices:[4,5,8]});
  }
  if (/ceramic|pottery/.test(interests)) {
    sections.push({key:'ceramics', title:'Because '+name+' likes ceramics', label:'Ceramics', indices:[0,7,10]});
  }
  if (!sections.length) {
    sections.push({key:'starting-ideas', title:'A few ideas to start', label:'Gift ideas', indices:[0,3,5]});
  }
  sections.push({key:'different', title:'Something a little different', label:'Something different', indices:[6,9,1]});
  return sections;
}
function filteredIdeas(indices, person = null) {
  const ranked = person ? rankedIdeas(indices,person) : indices;
  return ranked.filter(index=>

function chatGuess() {
  const text = chatTurns.filter(turn=>turn.role==='buyer').map(turn=>turn.text).join(' ');
  const named = /\b(friend|partner|coworker|sister|brother|cousin)\s+([A-Z][a-z]+)\b/.exec(text);
  const parent = /\bmy (mom|dad)\b/i.exec(text)?.[1];
  const relation = named?.[1] || (parent?'family':'');
  const event = /\b(birthday|anniversary|gift exchange|housewarming|graduation|baby shower|Christmas|Mother’s Day|Father’s Day)\b/i.exec(text)?.[0] || '';
  const date = /\b(\d{4}-\d{2}-\d{2})\b/.exec(text)?.[1] || '';
  return {
    name:named?.[2] || (parent ? parent[0].toUpperCase()+parent.slice(1).toLowerCase() : /\b(?:it’s for|it.s for|named)\s+([A-Z][a-z]+)\b/.exec(text)?.[1] || ''),
    relation: /sister|brother|cousin/.test(relation) ? 'Family' : relation.charAt(0).toUpperCase()+relation.slice(1),
    occasion:event.charAt(0).toUpperCase()+event.slice(1),
    date:Number.isNaN(parseDate(date).valueOf())?'':date
  };
}
function sendChat(text) {
  chatTurns.push({role:'buyer',text});
  const guess = chatGuess();
  if (!guess.name) {
    chatTurns.push({role:'assistant',text:'Is there someone in particular you’re shopping for? A name or nickname is enough.'});
  } else if (!guess.occasion) {
    chatTurns.push({role:'assistant',text:'What’s the occasion for '+guess.name+'?'});
  } else {
    const reply = {role:'assistant',text:'I’d start with something personal for '+guess.name+'’s '+guess.occasion.toLowerCase()+', like a handmade piece they can use every day.'};
    const existing = state.people.some(person=>person.name.toLowerCase()===guess.name.toLowerCase());
    if (!offeredInChat && !existing) {
      reply.offer = true;
      reply.guess = guess;
      offeredInChat = true;
    }
    chatTurns.push(reply);
  }
  render('chat');
  requestAnimationFrame(()=>document.querySelector('#chat-compose input')?.focus());
}
function chatPage() {
  const guess = chatGuess();
  const last = chatTurns.at(-1);
  const suggestion = !guess.name ? 'It’s for my friend Nora' : !guess.occasion ? 'It’s for her birthday' : '';
  return '<section class="page narrow">'+crumbs('gifts','Gifts')+'<div class="chat-head"><h1>Gift chat</h1><small>Scripted walkthrough</small></div>'+
    chatTurns.map((turn,index)=>'<div class="bubble '+(turn.role==='buyer'?'buyer':'')+'">'+escape(turn.text)+'</div>'+
      (turn.offer && !turn.dismissed && turn===last ? '<div class="chat-save"><p><strong>Save '+escape(turn.guess.name)+' for next time?</strong></p>'+
        '<p>Keep the occasion and who it’s for together in a gift profile.</p><div class="row">'+
        button('Save profile','data-chat-save="'+index+'"','outline')+button('Not now','data-chat-dismiss="'+index+'"','link')+'</div></div>':
        turn.saved?'<p class="muted quiet">Profile saved</p>':'')).join('')+
    (suggestion?'<button class="chip" data-message="'+escape(suggestion)+'">'+escape(suggestion)+'</button>':'')+
    '<form id="chat-compose" data-form="chat" class="chatline"><input name="text" aria-label="Add a chat message" placeholder="Add a detail…" maxlength="500" required>'+
    button('Send','type="submit"')+'</form></section>';
}

function render(next = page, scroll = true) {
  if (page!==next && ['shop','browse'].includes(next)) {
    browseFilter = 'all';
    browsePrice = '';
    browseDelivery = '';
  }
  page = next;
  const person = active();
  if (['profile','settings','history','browse'].includes(page) && !person) { render('profiles'); return; }
  const pages = {gifts:giftsPage, profiles:profilesPage, profile:()=>profilePage(person), settings:()=>settingsPage(person),
    history:()=>historyPage(person), chat:chatPage, browse:()=>browsePage(person), shop:regularBrowsePage, checkout:checkoutPage,
    confirmation:confirmationPage, purchases:purchasesPage};
  main.innerHTML = pages[page]();
  if (scroll) window.scrollTo(0,0);
}
function modal(title, body) {
  dialog.className = '';
  dialog.innerHTML = '<button class="close" data-action="close" aria-label="Close">×</button><h2 id="dialogTitle">'+title+'</h2>'+body;
  if (!dialog.open) dialog.showModal();
  dialog.querySelector('input, select')?.focus();
}
const submit = label => button(label,'type="submit"');
const input = (label, name, value='', type='text', attrs='') =>
  '<label class="field">'+label+'<input name="'+name+'" type="'+type+'" value="'+escape(value)+'" '+attrs+'></label>';
const select = (label,name,content,attrs='') => '<label class="field">'+label+'<select name="'+name+'" '+attrs+'>'+content+'</select></label>';
const option = (value,label,current) => '<option value="'+value+'"'+(value===current?' selected':'')+'>'+label+'</option>';
const leadOptions = current => ['1','3','7','14','21','30'].map(days=>option(days,days+' '+(days==='1'?'day':'days')+' before',current)).join('');
const checkbox = (name,label,checked=false) => '<label><input type="checkbox" name="'+name+'" '+(checked?'checked':'')+'> '+label+'</label>';

function occasionInputs(occasion = {}, required = true) {
  const attr = required?'required':'';
  return '<div class="fields">'+input('Occasion'+(required?' (required)':''),'occasion',occasion.name,'text',attr+' maxlength="45" placeholder="e.g. Birthday"')+
    input('Date'+(required?' (required)':''),'date',occasion.date,'date',attr)+'</div>'+
    '<div class="row spread">'+checkbox('annual','Repeat yearly',occasion.annual)+
    (required?'':button('Remove','type="button" data-action="remove-occasion"','link'))+'</div>';
}
function optionalTaste(person = {}) {
  return input('Interests or hobbies (optional)','interests',person.interests,'text','maxlength="120" placeholder="e.g. Gardening, pottery"')+
    input('Style or vibe (optional)','style',person.style,'text','maxlength="120" placeholder="e.g. Earthy, colorful, minimal"');
}
function optionalLogistics(person = {}, withAddress = true) {
  return input('Typical gift budget in USD (optional)','budget',person.budget,'number','min="0" max="99999" step="0.01"')+
    (withAddress?input('Demo address or label (optional)','address',person.address,'text','maxlength="120" placeholder="Use a fictional address"'):'');
}
function profileForm(mode, prefill = {}, chatIndex = '') {
  const editing = mode==='edit';
  const values = editing ? active() : prefill;
  const description = mode==='chat' ? '<p class="muted">Review the details from chat before saving.</p>' : '';
  modal(editing?'Edit profile':'Create a profile',description+'<form data-form="profile" data-mode="'+mode+'" data-chat-index="'+chatIndex+'">'+
    input('Name or nickname (required)','name',values.name,'text','maxlength="40" required')+
    select('Relationship (required)','relation','<option value="">Choose a relationship</option>'+
      relationships.map(relation=>option(relation,relation,values.relation)).join(''),'required')+
    (editing?optionalLogistics(values):
      '<p class="section-label">Occasions</p><p class="form-note">Add at least one occasion.</p><div id="occasion-fields"><fieldset class="occasion-group"><legend>First occasion</legend>'+
      occasionInputs({name:values.occasion,date:values.date})+'</fieldset></div>'+button('+ Add another occasion','type="button" data-action="extra-occasion"','outline')+
      '<details class="optional-fields"><summary><strong>Add optional details</strong></summary><div>'+optionalTaste()+optionalLogistics({},false)+'</div></details>')+
    '<div class="dialog-actions">'+submit(editing?'Save changes':'Save profile')+
    (editing?button('Delete profile','type="button" data-action="delete"','link danger'):'')+'</div></form>');
}
function occasionForm(index) {
  const existing = active().occasions[index];
  modal(existing?'Edit occasion':'Add an occasion','<form data-form="occasion" data-index="'+index+'">'+occasionInputs(existing)+
    '<div class="dialog-actions">'+submit('Save occasion')+
    (existing&&active().occasions.length>1?button('Remove occasion','type="button" data-remove-event="'+index+'"','link danger'):'')+'</div></form>');
}
function channelInputs(selected) {
  return '<fieldset class="reminder-channels"><legend>Where to notify you</legend><div class="notification-list">'+channelNames.map(name=>
    '<label><input type="checkbox" name="channels" value="'+name+'" '+(selected.includes(name)?'checked':'')+
    '><span><strong>'+name+'</strong><small>'+channelInfo[name]+'</small></span></label>').join('')+'</div></fieldset>';
}
function defaultSettingsForm() {
  const defaults = state.defaults;
  modal('Reminder settings','<form data-form="defaults" class="reminder-form"><div class="reminder-toggle">'+
    checkbox('enabled','Turn on gift reminders',defaults.enabled)+
    '<small>Applies to upcoming occasions on profiles using your defaults. Switching off pauses delivery for all profiles.</small></div>'+
    select('When to remind','lead',leadOptions(defaults.lead))+channelInputs(defaults.channels)+
    '<p class="form-note">Channel choices are simulated in this walkthrough.</p><p class="form-error" role="alert"></p>'+submit('Save settings')+'</form>');
}
function profileReminderForm() {
  const person = active();
  const custom = person.override==='custom';
  modal('Reminders for '+escape(person.name),'<form data-form="override" class="reminder-form">'+
    select('Reminder preference','override',[option('inherit','Use account defaults',person.override),option('custom','Customize for this profile',person.override),
      option('off','Turn off for this profile',person.override)].join(''))+
    '<div data-custom '+(custom?'':'hidden')+'>'+select('When to remind','lead',leadOptions(custom?person.lead:state.defaults.lead))+
    channelInputs(custom?person.channels:state.defaults.channels)+'</div>'+
    (!state.defaults.enabled?'<p class="form-note">Account reminders are off. These choices will apply when reminders are turned on.</p>':'')+
    '<p class="form-error" role="alert"></p>'+submit('Save reminder settings')+'</form>');
}
function quiz(step = 0) {
  if (step===quizQuestions.length) {
    modal('Review quiz picks','<p>'+ (quizAnswers.length?quizAnswers.map(pick=>'<span class="pill">'+pick+'</span>').join(''):'You skipped all the questions.')+
      '</p><div class="dialog-actions">'+ (quizAnswers.length?button('Save to taste','data-action="save-quiz"'):'')+
      button('Start over','data-action="quiz"','outline')+'</div>');
    return;
  }
  const [question, first, second] = quizQuestions[step];
  modal('Taste quiz','<p class="muted">Question '+(step+1)+' of '+quizQuestions.length+'</p><p><strong>'+question+'</strong></p>'+
    '<div class="quiz-options">'+[first,second].map((answer,index)=>
      '<button class="quiz-choice" data-quiz="'+step+'" data-answer="'+answer+'">'+photo(14+2*step+index)+
      '<span>'+answer+'</span></button>').join('')+'</div>'+
    button('Skip this question','data-quiz="'+step+'"','link'));
  dialog.className = 'visual-quiz';
  dialog.querySelector('.quiz-choice')?.focus();
}
function saveGift(person, index) {
  if (!person || person.saved.includes(index)) return;
  person.saved.push(index);
  persist();
}
function pickRecipient(index, purchased = false) {
  const rows = state.people.map(person=>{
    const attrs = purchased ? 'data-attach="'+person.id+'"' : 'data-add-saved="'+person.id+'" data-product="'+index+'"';
    const saved = !purchased && person.saved.includes(index);
    return button(escape(person.name)+(saved?' ✓':''),attrs+(saved?' disabled':''),'outline recipient-option');
  }).join('');
  modal(purchased?'Who was this gift for?':'Save gift idea',listing(index)+'<div class="block">'+
    (rows || '<p>Add someone to save this gift to a profile.</p>')+
    button('+ Create a profile',purchased?'data-action="from-order"':'data-create-for-item="'+index+'"','link')+'</div>');
}
function viewListing(index) {
  const person = page==='browse'?active():null;
  if (person?.learn) {
    person.viewed = person.viewed.filter(value=>value!==index);
    person.viewed.push(index);
    persist();
  }
  const saved = person?.saved.includes(index);
  modal(productName(index),photo(products[index][2],productName(index)).replace('<img ','<img class="product-preview" ')+
    '<p><strong>'+money(index)+'</strong>'+(person?' <span class="listing-delivery">'+arrivalLabel(index)+'</span>':'')+'</p>'+
    button(saved?'Remove from saved gifts':person?'Save for '+escape(person.name):'Save to a profile','data-save="'+index+'"','outline'));
}
function attachOrder(person) {
  if (!person || state.order!==null) return;
  if (!person.past.includes(0)) person.past.push(0);
  state.order = person.id;
  persist();
}
function launchChat(text) {
  chatTurns = [];
  offeredInChat = false;
  sendChat(text);
}
function setNotice(message, next = page) {
  notice = message;
  render(next,false);
}
document.addEventListener('click', event=>{
  const target = event.target.closest('button');
  if (!target) return;
  const data = target.dataset;
  notice = '';
  if (data.go) { render(data.go); return; }
  if (data.person) {
    activeId = Number(data.person);
    render('profile');
    if (target.hasAttribute('data-occasion')) document.querySelector('#occasions').scrollIntoView({block:'center'});
    return;
  }
  if (data.example) { launchChat(data.example); return; }
  if (data.message) { sendChat(data.message); return; }
  if (data.chatSave!==undefined) { profileForm('chat',chatTurns[Number(data.chatSave)].guess,data.chatSave); return; }
  if (data.chatDismiss!==undefined) { chatTurns[Number(data.chatDismiss)].dismissed = true; render('chat',false); return; }
  if (data.event!==undefined) { occasionForm(Number(data.event)); return; }
  if (data.removeEvent!==undefined) {
    if (active().occasions.length>1) active().occasions.splice(Number(data.removeEvent),1);
    dialog.close(); persist(); setNotice('Occasion removed.'); return;
  }
  if (data.quiz!==undefined) {
    if (data.answer) quizAnswers.push(data.answer);
    quiz(Number(data.quiz)+1); return;
  }
  if (data.browseFilter) {
    browseFilter = data.browseFilter;
    render(page);
    return;
  }
  if (data.linkPurchase) {
    const purchase = purchaseHistory().find(item=>item.id===data.linkPurchase);
    if (!purchase || purchaseRecipient(purchase) || !active()) return;
    if (purchase.id==='demo-order') attachOrder(active());
    else state.purchaseLinks[purchase.id] = activeId;
    persist();
    dialog.close();
    setNotice('Gift linked to '+active().name+'.');
    return;
  }
  if (data.view!==undefined) { viewListing(Number(data.view)); return; }
  if (data.save!==undefined) {
    const index = Number(data.save);
    if (page!=='browse') { pickRecipient(index); return; }
    const person = active();
    const saved = person.saved.includes(index);
    if (saved) person.saved = person.saved.filter(value=>value!==index);
    else saveGift(person,index);
    persist();
    if (dialog.open) dialog.close();
    setNotice(saved?'Removed from saved gifts.':'Saved for '+person.name+'.');
    return;
  }
  if (data.addSaved) {
    const person = personById(data.addSaved);
    saveGift(person,Number(data.product));
    dialog.close(); setNotice('Saved for '+person.name+'.'); return;
  }
  if (data.createForItem!==undefined) { profileForm('gift-'+data.createForItem); return; }
  if (data.attach) {
    attachOrder(personById(data.attach));
    dialog.close(); render(orderReturn); return;
  }
  switch (data.action) {
    case 'close': dialog.close(); break;
    case 'add': profileForm('new'); break;
    case 'edit': profileForm('edit'); break;
    case 'from-order': profileForm('order'); break;
    case 'extra-occasion': {
      const container = dialog.querySelector('#occasion-fields');
      container.insertAdjacentHTML('beforeend','<fieldset class="occasion-group"><legend>Another occasion</legend>'+occasionInputs({},false)+'</fieldset>');
      container.lastElementChild.querySelector('input').focus(); break;
    }
    case 'remove-occasion': target.closest('fieldset').remove(); dialog.querySelector('[data-action="extra-occasion"]').focus(); break;
    case 'occasion': occasionForm(-1); break;
    case 'defaults': defaultSettingsForm(); break;
    case 'profile-settings': render('settings'); break;
    case 'override': profileReminderForm(); break;
    case 'start-session': render('browse'); break;
    case 'clear-history': active().viewed = []; persist(); setNotice('Browsing history cleared.'); break;
    case 'taste': modal('Add taste details','<form data-form="taste">'+optionalTaste(active())+submit('Save taste details')+'</form>'); break;
    case 'quiz': quizAnswers = []; quiz(); break;
    case 'save-quiz': active().quiz = [...quizAnswers]; persist(); dialog.close(); setNotice('Quiz picks saved to taste.'); break;
    case 'past-purchase': linkPurchaseDialog(); break;
    case 'place-order': state.orderPlaced = true; persist(); render('confirmation'); break;
    case 'order-pick': orderReturn = page; pickRecipient(0,true); break;
    case 'delete': modal('Delete '+escape(active().name)+'’s profile?','<p>Saved details and gift links for this profile will be removed.</p>'+
      '<div class="dialog-actions">'+button('Delete profile','data-action="confirm-delete"')+
      button('Cancel','data-action="edit"','outline')+'</div>'); break;
    case 'confirm-delete':
      state.people = state.people.filter(person=>person.id!==activeId);
      if (state.order===activeId) state.order = null;
      state.purchaseLinks = Object.fromEntries(Object.entries(state.purchaseLinks).filter(([,id])=>id!==activeId));
      persist(); dialog.close(); setNotice('Profile deleted.','profiles'); break;
  }
});
document.addEventListener('change',event=>{
  if (['browse-price','browse-delivery'].includes(event.target.name)) {
    const {name,value} = event.target;
    if (name==='browse-price') browsePrice = value;
    else browseDelivery = value;
    render(page,false);
    document.querySelector('select[name="'+name+'"]')?.focus({preventScroll:true});
  }
  if (event.target.name==='override') dialog.querySelector('[data-custom]').hidden = event.target.value!=='custom';
});
function readOccasions(form) {
  const occasions = [];
  for (const row of form.querySelectorAll('.occasion-group')) {
    const title = row.querySelector('[name=occasion]');
    const date = row.querySelector('[name=date]');
    const annual = row.querySelector('[name=annual]').checked;
    if (!title.value.trim() && !date.value && !annual && !title.required) continue;
    const missing = !title.value.trim()?title:!date.value?date:null;
    if (missing) { invalidInput(missing,'Enter both an occasion and a date, or remove this row.'); return null; }
    occasions.push({name:title.value.trim(),date:date.value,annual});
  }
  return occasions;
}
function invalidInput(input, message) {
  input.setCustomValidity(message);
  input.reportValidity();
  input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});
}
document.addEventListener('submit',event=>{
  const form = event.target;
  const action = form.dataset.form;
  if (!action) return;
  event.preventDefault();
  const values = new FormData(form);
  const value = name => String(values.get(name)??'').trim();
  for (const required of form.querySelectorAll('input[required]')) {
    if (!required.value.trim()) { invalidInput(required,'Please enter a value.'); return; }
  }
  const person = active();
  const channels = values.getAll('channels');
  const custom = value('override')==='custom';
  if (((action==='defaults' && values.has('enabled')) || (action==='override' && custom)) && !channels.length) {
    form.querySelector('.form-error').textContent = 'Choose at least one notification channel.';
    return;
  }
  let next = page;
  switch (action) {
    case 'chat':
      if (page==='gifts') launchChat(value('text'));
      else sendChat(value('text'));
      return;
    case 'profile': {
      const mode = form.dataset.mode;
      if (mode==='edit') {
        Object.assign(person,{name:value('name'),relation:value('relation'),budget:value('budget'),address:value('address')});
        notice = 'Profile updated.';
        break;
      }
      const occasions = readOccasions(form);
      if (!occasions?.length) return;
      const created = {id:++state.serial,name:value('name'),relation:value('relation'),occasions,saved:[],past:[],viewed:[],
        interests:value('interests'),style:value('style'),quiz:[],budget:value('budget'),address:'',
        learn:false,override:'inherit',lead:state.defaults.lead,channels:[...state.defaults.channels]};
      state.people.push(created);
      activeId = created.id;
      next = 'profile';
      if (mode==='order') { attachOrder(created); next = orderReturn; }
      if (mode.startsWith('gift-')) { saveGift(created,Number(mode.slice(5))); next = 'shop'; }
      if (mode==='chat') { chatTurns[Number(form.dataset.chatIndex)].saved = true; chatTurns[Number(form.dataset.chatIndex)].dismissed = true; }
      notice = 'Profile saved.';
      break;
    }
    case 'occasion': {
      const index = Number(form.dataset.index);
      const occasion = {name:value('occasion'),date:value('date'),annual:values.has('annual')};
      if (index<0) person.occasions.push(occasion);
      else person.occasions[index] = occasion;
      notice = 'Occasion saved.';
      break;
    }
    case 'taste':
      person.interests = value('interests'); person.style = value('style'); notice = 'Taste details saved.'; break;
    case 'defaults':
      state.defaults = {enabled:values.has('enabled'),lead:value('lead'),channels}; notice = 'Reminder settings saved.'; break;
    case 'override':
      person.override = value('override');
      if (custom) { person.lead = value('lead'); person.channels = channels; }
      notice = 'Profile reminder settings saved.'; break;
    case 'learning':
      person.learn = values.has('learn'); notice = 'Learning preference saved.'; break;
  }
  persist();
  if (dialog.open) dialog.close();
  render(next,next!==page);
});
document.querySelector('#reset').onclick = ()=>{
  state = seed(); activeId = 1; chatTurns = []; offeredInChat = false; notice = '';
  persist(); render('gifts');
};
const fullscreen = document.querySelector('#fullscreen');
fullscreen.onclick = async()=>{
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.body.requestFullscreen();
  } catch { fullscreen.textContent = 'Use browser View → Enter Full Screen'; }
};
document.addEventListener('fullscreenchange',()=>{
  fullscreen.textContent = document.fullscreenElement?'Exit full screen':'Full screen';
});
render();
</script></body></html>
